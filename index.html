<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 时光机 - 回到小时候</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center bg-stone-100 overflow-hidden py-4 sm:py-8">
    <div class="tv-scanlines fixed inset-0 z-50 pointer-events-none opacity-20"></div>

    <!-- H5 Container -->
    <div class="relative w-full max-w-[390px] aspect-[750/1624] bg-stone-50 shadow-2xl rounded-[40px] overflow-hidden flex flex-col noise-bg border-[12px] border-stone-800">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-28 h-6 bg-stone-800 rounded-b-2xl z-[60]"></div>
        
        <div id="screen-container" class="flex-1 overflow-y-auto no-scrollbar relative flex flex-col bg-[#f5f5dc]">
            <!-- Welcome Screen -->
            <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center text-center px-8 py-12 screen-transition">
                <div class="mb-8 relative">
                    <div class="absolute -inset-4 border-2 border-dashed border-[#5d4037] rounded-full opacity-20 animate-[spin_20s_linear_infinite]"></div>
                    <div class="w-28 h-28 bg-[#5d4037] rounded-full flex items-center justify-center shadow-inner relative z-10">
                        <i data-lucide="history" class="w-14 h-14 text-[#f5f5dc] animate-pulse"></i>
                    </div>
                </div>
                <h1 class="text-4xl font-nostalgia font-bold text-[#5d4037] mb-4 tracking-wider leading-tight">
                    AI 时光机<br/><span class="text-xl opacity-80">- 回到小时候 -</span>
                </h1>
                <p class="text-sm text-stone-600 mb-12 font-medium">
                    沉浸式穿越体验，重拾童年纯真记忆<br/>
                    让这一刻，定格最无忧无虑的时光
                </p>
                <button id="start-btn" class="group relative px-10 py-4 bg-[#5d4037] text-[#f5f5dc] font-bold text-lg rounded-full shadow-xl flex items-center gap-2 active:scale-95 transition-transform">
                    <span>启动时光机</span>
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
                <p class="mt-8 text-xs text-stone-400 tracking-widest uppercase">80s · 90s · 00s Memories</p>
            </div>

            <!-- Style/Theme Select Screen -->
            <div id="theme-screen" class="hidden-screen flex-1 w-full px-6 py-8 flex flex-col screen-transition">
                <div class="flex items-center justify-between mb-8">
                    <button class="back-btn p-2 text-stone-500 hover:text-[#5d4037]">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                    </button>
                    <h2 class="text-xl font-nostalgia font-bold text-[#5d4037]">我们要穿越到...</h2>
                    <div class="w-10"></div>
                </div>
                <div id="themes-list" class="flex-1 space-y-3 overflow-y-auto no-scrollbar pb-6">
                    <!-- Themes will be injected here -->
                </div>
                <div class="mt-4 space-y-3 flex flex-col items-center">
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                    <button id="cross-btn" class="w-full py-3.5 rounded-xl font-bold text-base shadow-lg flex items-center justify-center gap-2 bg-stone-200 text-stone-400 transition-all">
                        <i data-lucide="camera" class="w-4.5 h-4.5"></i>
                        <span>选好了，开始穿越</span>
                    </button>
                    <p class="text-[10px] text-stone-400 font-medium">请上传清晰正面照，还原效果更好哦</p>
                </div>
            </div>

            <!-- Generating Screen -->
            <div id="generating-screen" class="hidden-screen flex-1 w-full px-6 py-8 flex flex-col animate-pulse-slow screen-transition">
                <div class="mb-10 flex flex-col items-center">
                    <div class="relative w-20 h-20 mb-4">
                        <div class="absolute inset-0 border-4 border-[#5d4037] border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <h2 class="text-xl font-nostalgia font-bold text-[#5d4037] mb-2">正在时空隧道中...</h2>
                    <div class="w-full h-1.5 bg-stone-200 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-[#5d4037] transition-[width] duration-[10s] ease-linear w-0"></div>
                    </div>
                </div>
                <div class="flex-1 bg-white rounded-3xl p-6 shadow-xl relative border-2 border-[#e0c9a6] flex flex-col">
                    <div id="trivia-step" class="absolute -top-3 right-6 bg-[#5d4037] text-[#f5f5dc] px-3 py-0.5 rounded-full text-[10px] font-bold">挑战: 1 / 4</div>
                    <h3 id="trivia-question" class="text-sm font-bold mb-6 text-stone-800 leading-relaxed">📖 考考你的童年回忆：<br/><span class="text-[#5d4037] block mt-2 text-base">...</span></h3>
                    <div id="trivia-options" class="flex-1 space-y-2">
                        <!-- Options injected here -->
                    </div>
                    <div class="mt-6 flex items-center justify-between text-stone-400 text-[10px]">
                        <span class="font-bold">获得勋章: <span id="score-text">0</span></span>
                        <div id="score-dots" class="flex gap-1"></div>
                    </div>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden-screen flex-1 w-full px-5 py-6 flex flex-col items-center overflow-y-auto no-scrollbar screen-transition">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-nostalgia font-bold text-[#5d4037]">穿越成功！</h2>
                    <p class="text-[10px] text-stone-500 font-medium mt-1 italic">长按图片即可保存到相册</p>
                </div>
                <div class="w-full space-y-6">
                    <div class="w-full flex flex-col items-center bg-white p-4 rounded-[32px] shadow-xl border-4 border-white">
                        <div class="w-full aspect-[3/4] bg-stone-200 rounded-2xl overflow-hidden relative shadow-inner mb-4">
                            <img id="generated-image" src="" alt="Childhood Memory" class="w-full h-full object-cover">
                            <div class="absolute top-4 left-4">
                                <span id="theme-tag" class="px-2 py-1 bg-[#5d4037] text-white text-[8px] font-bold rounded-md shadow-sm">主题</span>
                            </div>
                        </div>
                        <div class="w-full px-2 py-1 text-center">
                            <p class="text-xs font-calligraphy leading-relaxed text-stone-600 italic">“童年很短，快乐很长。那颗赤诚的童心，永远是你对抗世俗的盾牌。”</p>
                        </div>
                    </div>
                    <div class="w-full space-y-3">
                        <button class="w-full flex items-center justify-center gap-3 bg-[#5d4037] text-[#f5f5dc] py-4 rounded-2xl font-bold text-base shadow-lg shadow-[#5d4037]/20 active:scale-[0.98] transition-all">
                            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                            <span>生成童年专属视频</span>
                        </button>
                        <div class="grid grid-cols-3 gap-2">
                            <button class="flex flex-col items-center justify-center gap-1.5 bg-white text-stone-700 py-3 rounded-2xl font-bold text-[11px] shadow-md border border-stone-50 active:scale-95 transition-all">
                                <div class="w-8 h-8 bg-[#f5f5dc] rounded-full flex items-center justify-center">
                                    <i data-lucide="share-2" class="w-4 h-4 text-[#5d4037]"></i>
                                </div>
                                <span>保存海报</span>
                            </button>
                            <button id="blind-box-btn" class="flex flex-col items-center justify-center gap-1.5 bg-yellow-400 text-yellow-900 py-3 rounded-2xl font-bold text-[11px] shadow-md active:scale-95 transition-all">
                                <div class="w-8 h-8 bg-yellow-500/20 rounded-full flex items-center justify-center">
                                    <i data-lucide="gift" class="w-4 h-4"></i>
                                </div>
                                <span>时光盲盒</span>
                            </button>
                            <button class="back-btn flex flex-col items-center justify-center gap-1.5 bg-stone-100 text-stone-600 py-3 rounded-2xl font-bold text-[11px] shadow-md active:scale-95 transition-all">
                                <div class="w-8 h-8 bg-stone-200 rounded-full flex items-center justify-center">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                </div>
                                <span>重新开始</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Blind Box Modal -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center relative border-4 border-yellow-400 shadow-2xl">
            <button id="close-modal" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="mb-6 flex justify-center">
                <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center">
                    <i data-lucide="gift" class="w-10 h-10 text-yellow-600"></i>
                </div>
            </div>
            <h3 class="text-xl font-bold mb-2 font-nostalgia">获得时光珍藏</h3>
            <p id="reward-text" class="text-stone-600 mb-6">铁皮玩具表情包</p>
            <button class="close-modal-action w-full py-3 bg-yellow-400 hover:bg-yellow-500 rounded-xl font-bold transition-colors">
                收入回忆包
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
